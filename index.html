<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portable Solution Comparison Tool</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500;600&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="page-header">
  <h1 class="page-title">Portable Solution Comparison Tool</h1>
</header>

<main class="main" data-vpc-comparison>
  <div class="filter-bar" data-filter-bar>
    <div class="filter-bar-inner">
      <label class="filter-field">
        <span class="filter-label">Bed Capacity</span>
        <input type="number" class="filter-input" data-filter-input="bedCapacity" step="1" placeholder="min beds">
      </label>
      <label class="filter-field">
        <span class="filter-label">Internal Floorspace</span>
        <input type="number" class="filter-input" data-filter-input="intSqFt" step="1" placeholder="min sq ft">
      </label>
      <label class="filter-field">
        <span class="filter-label">External Footprint</span>
        <input type="number" class="filter-input" data-filter-input="extSqFt" step="1" placeholder="max sq ft">
      </label>
    </div>
  </div>
  <div class="table-panel">
    <table class="compare-table" data-compare-table>
      <thead>
        <tr>
          <th class="corner-cell" scope="col"></th>
          <th class="col-head" scope="col" data-col-head="0">
            <div class="col-head-inner">
              <div class="select-floater-host">
                <div class="select-anchor">
                  <select class="product-select" data-product-select="0" aria-label="Product for column 1"></select>
                </div>
              </div>
              <div class="logo-trigger-wrap">
                <img class="vendor-logo" data-vendor-logo="0" alt="" hidden>
                <button type="button" class="info-trigger" data-info-trigger="0" aria-label="Product note" aria-expanded="false" aria-controls="vpc-hdt-popover" hidden>ⓘ</button>
                <button type="button" class="untested-trigger" data-untested-trigger="0" aria-label="Not independently tested" aria-expanded="false" aria-controls="vpc-hdt-popover" hidden>*</button>
              </div>
            </div>
          </th>
          <th class="col-head" scope="col" data-col-head="1">
            <div class="col-head-inner">
              <div class="select-floater-host">
                <div class="select-anchor">
                  <select class="product-select" data-product-select="1" aria-label="Product for column 2"></select>
                </div>
              </div>
              <div class="logo-trigger-wrap">
                <img class="vendor-logo" data-vendor-logo="1" alt="" hidden>
                <button type="button" class="info-trigger" data-info-trigger="1" aria-label="Product note" aria-expanded="false" aria-controls="vpc-hdt-popover" hidden>ⓘ</button>
                <button type="button" class="untested-trigger" data-untested-trigger="1" aria-label="Not independently tested" aria-expanded="false" aria-controls="vpc-hdt-popover" hidden>*</button>
              </div>
            </div>
          </th>
          <th class="col-head" scope="col" data-col-head="2">
            <div class="col-head-inner">
              <div class="select-floater-host">
                <div class="select-anchor">
                  <select class="product-select" data-product-select="2" aria-label="Product for column 3"></select>
                </div>
              </div>
              <div class="logo-trigger-wrap">
                <img class="vendor-logo" data-vendor-logo="2" alt="" hidden>
                <button type="button" class="info-trigger" data-info-trigger="2" aria-label="Product note" aria-expanded="false" aria-controls="vpc-hdt-popover" hidden>ⓘ</button>
                <button type="button" class="untested-trigger" data-untested-trigger="2" aria-label="Not independently tested" aria-expanded="false" aria-controls="vpc-hdt-popover" hidden>*</button>
              </div>
            </div>
          </th>
          <th class="col-head" scope="col" data-col-head="3">
            <div class="col-head-inner">
              <div class="select-floater-host">
                <div class="select-anchor">
                  <select class="product-select" data-product-select="3" aria-label="Product for column 4"></select>
                </div>
              </div>
              <div class="logo-trigger-wrap">
                <img class="vendor-logo" data-vendor-logo="3" alt="" hidden>
                <button type="button" class="info-trigger" data-info-trigger="3" aria-label="Product note" aria-expanded="false" aria-controls="vpc-hdt-popover" hidden>ⓘ</button>
                <button type="button" class="untested-trigger" data-untested-trigger="3" aria-label="Not independently tested" aria-expanded="false" aria-controls="vpc-hdt-popover" hidden>*</button>
              </div>
            </div>
          </th>
          <th class="col-head" scope="col" data-col-head="4">
            <div class="col-head-inner">
              <div class="select-floater-host">
                <div class="select-anchor">
                  <select class="product-select" data-product-select="4" aria-label="Product for column 5"></select>
                </div>
              </div>
              <div class="logo-trigger-wrap">
                <img class="vendor-logo" data-vendor-logo="4" alt="" hidden>
                <button type="button" class="info-trigger" data-info-trigger="4" aria-label="Product note" aria-expanded="false" aria-controls="vpc-hdt-popover" hidden>ⓘ</button>
                <button type="button" class="untested-trigger" data-untested-trigger="4" aria-label="Not independently tested" aria-expanded="false" aria-controls="vpc-hdt-popover" hidden>*</button>
              </div>
            </div>
          </th>
        </tr>
      </thead>
      <tbody data-spec-body>
        <!-- Rows injected by app.js from specRows -->
      </tbody>
    </table>
  </div>
  <p class="footnote" data-untested-footnote hidden>* This product is included in the Vendor Product Catalog but was not independently tested by UC Davis during any IMPACTS project events or exercises.</p>
</main>

<div class="popover" id="vpc-hdt-popover" role="dialog" aria-label="Product note" hidden></div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
